name: Update calendar

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "0 14,15 * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send this text instead of game-day detection (leave empty for normal behavior)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-calendar

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node generate.mjs
      - name: Commit regenerated calendar
        run: |
          git config user.name "calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || git commit -m "chore: refresh calendar"
          git push

  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node generate.mjs
      - id: gameday
        run: node notify.mjs
        env:
          TEST_MESSAGE: ${{ inputs.test_message }}
      - name: Send game-day notification
        if: steps.gameday.outputs.games == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [[ ! "$NTFY_TOPIC" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::NTFY_TOPIC must be configured as a valid ntfy topic."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null \
            --header "Title: Game day" \
            --data-binary "$SMS_MESSAGE" \
            "https://ntfy.sh/$NTFY_TOPIC"
